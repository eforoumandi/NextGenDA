[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgenda"
version = "0.1.0"
description = "Generalized NextGen data-assimilation workflow for NGIAB/NextGen"
requires-python = ">=3.10"

dependencies = [
    "numpy==1.26.4",
    "pandas==3.0.5",
    "scipy==1.17.1",
    "xarray==2026.7.0",
    "netCDF4==1.7.4",
    "h5py==3.16.0",
    "PyYAML==6.0.3",
]

[project.scripts]
nextgenda = "nextgenda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
